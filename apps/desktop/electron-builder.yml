appId: org.standbye.app
productName: StandBye
copyright: Copyright © 2026 StandBye
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  - "!**/*.map"
afterPack: scripts/after-pack.cjs
asarUnpack:
  - "**/*.node"

# Releases are published to GitHub by .github/workflows/release.yml on a v* tag.
publish:
  provider: github
  owner: mirzaaghazadeh
  repo: StandBye

# No `arch:` lists anywhere below: the release workflow builds one arch per job and passes it as a
# CLI flag (--arm64 / --x64). An arch list in this file wins over that flag, which silently makes
# every job build every arch.
mac:
  category: public.app-category.developer-tools
  target: [dmg, zip]
  artifactName: StandBye-${version}-mac-${arch}.${ext}
  icon: build/icon.icns
  darkModeSupport: true
  # "-" is an ad-hoc signature: no certificate, no cost, but a real seal over the bundle.
  #
  # It must not go back to `null`. Null means electron-builder signs nothing at all, which leaves
  # only the linker's ad-hoc signature that Electron's prebuilt binary arrived with — a signature
  # that promises a sealed resource directory the bundle does not have. macOS reads that as a
  # *broken* signature rather than a missing one and shows the dead-end "StandBye is damaged and
  # can't be opened" alert, whose only buttons are Move to Trash and Cancel. That is what shipped
  # in 0.1.0; right-click → Open cannot rescue it.
  #
  # Ad-hoc only buys the ordinary "unidentified developer" prompt that Open Anyway clears. A clean
  # first launch needs a real Developer ID and notarization, which .github/workflows/release.yml
  # switches on with -c.mac.* overrides when the signing secrets are present.
  hardenedRuntime: false
  identity: "-"
dmg:
  artifactName: StandBye-${version}-mac-${arch}.${ext}
  title: StandBye ${version}

win:
  target: [nsis, zip]
  artifactName: StandBye-${version}-win-${arch}.${ext}
  icon: build/icon.png
  executableName: StandBye
  # Unsigned: SmartScreen warns on first run until we buy a code-signing certificate.
nsis:
  artifactName: StandBye-${version}-win-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: StandBye

linux:
  target: [AppImage, deb]
  # Without this the executable is named after the package (@crew/desktop), and AppImage refuses
  # the "@" and "/". It is also the WM_CLASS the .desktop entry matches windows against.
  executableName: standbye
  # electron-builder 26 dropped linux.desktopName; syncDesktopName names the .desktop entry after
  # executableName instead, which is what the window manager matches against.
  syncDesktopName: true
  maintainer: StandBye <hello@navid.tr>
  icon: build/icon.png
  category: Development
  synopsis: BYOK desktop app for 24/7 AI agent teams
  description: >-
    Describe a team of AI agents and they keep working on your repo around the clock:
    checking in on a schedule, talking to each other in channels, asking you when a
    decision is yours, and remembering what they learn. Bring your own keys.
  desktop:
    entry:
      Name: StandBye
      # Electron reports the executable name as WM_CLASS, so this has to match executableName
      # exactly or the running window won't link back to this launcher entry.
      StartupWMClass: standbye
appImage:
  artifactName: StandBye-${version}-linux-${arch}.${ext}
deb:
  artifactName: StandBye-${version}-linux-${arch}.${ext}
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libsecret-1-0

npmRebuild: false
nodeGypRebuild: false
