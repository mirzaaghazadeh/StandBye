server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # /download -> /download/ must be a relative redirect: behind a TLS-terminating proxy nginx
  # only sees plain http, and an absolute Location would send visitors back out over http://.
  absolute_redirect off;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
