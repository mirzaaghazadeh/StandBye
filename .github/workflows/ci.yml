name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Shared has to be built before the other packages can typecheck against it.
      - run: pnpm --filter @crew/shared build

      - run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Supervisor smoke test (no keys)
        run: pnpm smoke
