name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Attach the installers to a GitHub Release (otherwise they are build artifacts only)"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Hoisted so the macOS steps can branch on whether the signing secrets exist: `secrets` is not
    # available in a step `if`, but `env` is. Empty everywhere they are not set — a fork, or this
    # repo before the certificate is added — and the mac jobs then fall back to ad-hoc signing.
    env:
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # better-sqlite3 bundles a prebuilt binary for every platform in its own tarball, so no
          # job compiles anything and macOS x64 / Linux arm64 cross-build happily from the runner
          # images that are always available. Electron itself is downloaded per target arch.
          - name: mac-arm64
            os: macos-latest
            platform: mac
            nodePlatform: darwin
            arch: arm64
          - name: mac-x64
            os: macos-latest
            platform: mac
            nodePlatform: darwin
            arch: x64
          - name: win-x64
            os: windows-latest
            platform: win
            nodePlatform: win32
            arch: x64
          - name: linux-x64
            os: ubuntu-latest
            platform: linux
            nodePlatform: linux
            arch: x64
          - name: linux-arm64
            os: ubuntu-latest
            platform: linux
            nodePlatform: linux
            arch: arm64

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared and supervisor
        run: pnpm -r build

      # Passing the target here prunes the native binaries the other platforms would need.
      - name: Deploy supervisor for ${{ matrix.nodePlatform }}-${{ matrix.arch }}
        run: node scripts/deploy-supervisor.mjs --platform ${{ matrix.nodePlatform }} --arch ${{ matrix.arch }}

      - name: Build renderer and main
        working-directory: apps/desktop
        run: pnpm exec electron-vite build

      # notarytool wants the App Store Connect key as a file on disk, and a secret can only be an
      # env var. Written under RUNNER_TEMP, which is wiped with the runner.
      - name: Stage the notarization key
        if: matrix.platform == 'mac' && env.MAC_CSC_LINK != ''
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple-api-key.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/apple-api-key.p8" >> "$GITHUB_ENV"
          # An empty identity means "search the keychain", which is where CSC_LINK lands the
          # Developer ID certificate. It overrides the `identity: "-"` the config pins for the
          # certificate-less case. Entitlements are picked up from apps/desktop/build by name.
          echo "MAC_SIGN_ARGS=-c.mac.identity= -c.mac.hardenedRuntime=true -c.mac.notarize=true" >> "$GITHUB_ENV"

      - name: Package ${{ matrix.platform }} ${{ matrix.arch }}
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Windows has no Authenticode certificate, and macOS has one only when the secrets above
          # are set. Empty values are ignored, so this block is a no-op without them; the mac build
          # then ad-hoc signs instead, per `identity: "-"` in the config.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.platform == 'mac' && env.MAC_CSC_LINK != '' && 'true' || 'false' }}
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm exec electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never --config electron-builder.yml $MAC_SIGN_ARGS

      # 0.1.0 shipped a bundle with a signature that claimed resources it did not have, which macOS
      # reports as "StandBye is damaged and can't be opened" — an alert with no way past it. Nothing
      # in the build failed at the time. This is the check that would have caught it, and it guards
      # the ad-hoc and the Developer ID paths alike: a mac build that does not verify never ships.
      - name: Verify the macOS signature
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          app=$(find apps/desktop/release -maxdepth 2 -name '*.app' -type d | head -1)
          [ -n "$app" ] || { echo "no .app was produced"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app"
          if [ -n "$MAC_CSC_LINK" ]; then
            # Notarized builds must also pass the assessment an end user's Mac makes on first launch.
            spctl --assess --type exec -vv "$app"
            xcrun stapler validate "$app"
          fi

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out-artifacts
          # Only the distributables plus the updater metadata (latest*.yml) — not the unpacked app
          # directories, and not builder-debug.yml, which would otherwise ship in the release.
          find apps/desktop/release -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name 'latest*.yml' -o -name '*.blockmap' \) \
            -exec cp {} out-artifacts/ \;
          ls -lh out-artifacts

      - uses: actions/upload-artifact@v5
        with:
          name: standbye-${{ matrix.name }}
          path: out-artifacts/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Tags always publish; a manual run only publishes when explicitly asked.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: List what will be attached
        run: ls -lh artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
          generate_release_notes: true
          name: StandBye ${{ github.ref_name }}
          body: |
            Download the build for your machine below, or from [standbye.navid.tr/download](https://standbye.navid.tr/download).

            | Platform | File |
            | --- | --- |
            | macOS (Apple silicon) | `StandBye-*-mac-arm64.dmg` |
            | macOS (Intel) | `StandBye-*-mac-x64.dmg` |
            | Windows | `StandBye-*-win-x64-setup.exe` |
            | Linux | `StandBye-*-linux-x86_64.AppImage` or `.deb` |

            StandBye needs **Node.js 22+** on the machine: the app launches its bundled supervisor
            with your own `node`.

            These builds are not notarized, so the first launch needs a nudge — on macOS open
            System Settings → Privacy & Security and click "Open Anyway", on Windows click
            "More info" then "Run anyway".
