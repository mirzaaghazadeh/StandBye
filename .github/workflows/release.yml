name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Attach the installers to a GitHub Release (otherwise they are build artifacts only)"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS x64 and Linux arm64 are cross-built, so every job runs on a runner image that is
          # always available. better-sqlite3 ships prebuilds for all five, so nothing compiles here.
          - name: mac-arm64
            os: macos-latest
            platform: mac
            nodePlatform: darwin
            arch: arm64
          - name: mac-x64
            os: macos-latest
            platform: mac
            nodePlatform: darwin
            arch: x64
          - name: win-x64
            os: windows-latest
            platform: win
            nodePlatform: win32
            arch: x64
          - name: linux-x64
            os: ubuntu-latest
            platform: linux
            nodePlatform: linux
            arch: x64
          - name: linux-arm64
            os: ubuntu-latest
            platform: linux
            nodePlatform: linux
            arch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared and supervisor
        run: pnpm -r build

      # The supervisor tree carries a native better-sqlite3, so it is deployed per target arch.
      - name: Deploy supervisor for ${{ matrix.nodePlatform }}-${{ matrix.arch }}
        run: node scripts/deploy-supervisor.mjs --platform ${{ matrix.nodePlatform }} --arch ${{ matrix.arch }}

      - name: Build renderer and main
        working-directory: apps/desktop
        run: pnpm exec electron-vite build

      - name: Package ${{ matrix.platform }} ${{ matrix.arch }}
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Nothing is signed yet: no Developer ID for macOS, no Authenticode certificate for
          # Windows. Turn these off so electron-builder does not try and fail.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm exec electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never --config electron-builder.yml

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out-artifacts
          # Only the distributables, not the unpacked app directories electron-builder leaves behind.
          find apps/desktop/release -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.yml' -o -name '*.blockmap' \) \
            -exec cp {} out-artifacts/ \;
          ls -lh out-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: standbye-${{ matrix.name }}
          path: out-artifacts/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Tags always publish; a manual run only publishes when explicitly asked.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List what will be attached
        run: ls -lh artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
          generate_release_notes: true
          name: Standbye ${{ github.ref_name }}
          body: |
            Download the build for your machine below, or from [standbye.org/download](https://standbye.org/download).

            | Platform | File |
            | --- | --- |
            | macOS (Apple silicon) | `Standbye-*-mac-arm64.dmg` |
            | macOS (Intel) | `Standbye-*-mac-x64.dmg` |
            | Windows | `Standbye-*-win-x64-setup.exe` |
            | Linux | `Standbye-*-linux-x86_64.AppImage` or `.deb` |

            Standbye needs **Node.js 22+** on the machine: the app launches its bundled supervisor
            with your own `node`.

            Nothing is code-signed yet, so the first launch needs a nudge — on macOS right-click the
            app and choose Open, on Windows click "More info" then "Run anyway".
